[build-system]
requires = ["setuptools>=84.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atspm-report"
version = "2.0.0"
authors = [
  { name="Shawn Strasser", email="shawn.strasser@odot.oregon.gov" },
]
description = "Generate ATSPM anomaly detection reports with CUSUM analysis and PDF output."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]

dependencies = [
    "duckdb>=2.0.0",
    "pandas>=3.1.0",
    "numpy>=2.5.0",
    "reportlab>=5.1.0",
    "matplotlib>=3.11.0",
]

[project.optional-dependencies]
# Detector health from the raw event log (run_atspm_detector_health needs the
# periods table, new in atspm-detector 2.0.0).
detector = [
    "atspm-detector>=2.0.0",
]
dev = [
    "pytest>=9.2.0",
    "pytest-xdist>=3.8",
    "pyarrow>=26.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atspm_report = ["jokes.csv", "images/*.png"]
